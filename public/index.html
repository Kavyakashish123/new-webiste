const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Number(n).toLocaleString('en-IN');

function blankState(){return {partners:[],leads:[],messages:{},settled:[],flow:seed.flow}}
let stateData;try{stateData=JSON.parse(localStorage.getItem('wappcart-states-v2'))}catch{}
if(!stateData){stateData=Object.fromEntries(stateNames.map(s=>[s,blankState()]));
 data.partners.forEach(p=>{let region=/bengaluru|bangalore|mysore|mysuru|ballari|mangalore/i.test(p.city)?'Karnataka':/vijayawada|visakhapatnam|vizag|guntur|tirupati|nellore/i.test(p.city)?'Andhra Pradesh':'Telangana';stateData[region].partners.push({...p,state:region});});
 data.leads.forEach((l,i)=>{let region=stateNames.find(s=>stateData[s].partners.some(p=>p.name===l.partner))||'Telangana';let bucket=stateData[region],n=bucket.leads.length;bucket.leads.push(l);if(data.messages[i])bucket.messages[n]=data.messages[i];if(data.settled.includes(i))bucket.settled.push(n);});

const partnerCategories=['Interiors and Architect Firms','Hardware','Modular Furniture Manufacturers','Loose Furniture Manufacturers','Profile and Glass','Trainings'];
const legacyCategories={'Interior services':'Interiors and Architect Firms','Hardware & materials':'Hardware','Modular furniture':'Modular Furniture Manufacturers','Upholstered furniture':'Loose Furniture Manufacturers'};

function selectPartnerGroup(index){partnerGroup=index<0?'All partners':partnerCategories[index];render()}

let page='Overview',thread=0,filter='';const stages=['New enquiry','Quotation','Follow-up','Won'];function save(){localStorage.setItem('wappcart-states-v2',JSON.stringify(stateData))}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500)}
const navs=[['Overview','▦'],['WhatsApp Inbox','☏'],['Sales Pipeline','▤'],['Partners','◇'],['Commissions','◈'],['Chatbot Flow','⑂']];function go(p){page=p;filter='';render()}function title(t,sub,actions=''){return `<div class="titlebar"><div><h1>${t}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}function badge(s){return `<span class="badge ${s==='Won'?'green':s==='Follow-up'?'orange':''}">${esc(s)}</span>`}function partner(l){return data.partners.find(p=>p.name===l.partner)||{rate:0}}function earned(){return data.leads.filter(l=>l.stage==='Won').reduce((a,l)=>a+l.value*partner(l).rate/100,0)}function stats(){let won=data.leads.filter(l=>l.stage==='Won');return `<div class="stats">${[['Active enquiries',data.leads.filter(l=>l.stage!=='Won').length,'Open enquiries in '+currentState,'◌'],['Sales confirmed',money(won.reduce((a,l)=>a+l.value,0)),'Confirmed demo orders','↗'],['Commission earned',money(earned()),'Based on partner agreements','◈'],['Sales partners',String(data.partners.length).padStart(2,'0'),'Partners in '+currentState,'◇']].map(x=>`<div class="card stat"><div class="stathead">${x[0]}<span>${x[3]}</span></div><div class="value">${x[1]}</div><div class="trend">${x[2]}</div></div>`).join('')}</div>`}
function leadTable(){return `<div class="tablewrap"><table><thead><tr><th>CUSTOMER</th><th>PARTNER</th><th>ORDER VALUE</th><th>STAGE</th><th>SOURCE</th></tr></thead><tbody>${data.leads.slice().reverse().map(l=>`<tr><td><div class="person"><span class="avatar">${esc(l.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><div><b>${esc(l.name)}</b><small>${esc(l.need)}</small></div></div></td><td>${esc(l.partner)}</td><td>${money(l.value)}</td><td>${badge(l.stage)}</td><td>${esc(l.source)}</td></tr>`).join('')}</tbody></table></div>`}
function overview(){return title(currentState+' dashboard','Your state’s partners, conversations, sales and commissions.',`<button class="btn light" onclick="exportCSV()">↓ Export report</button><button class="btn" onclick="leadForm()">＋ Add enquiry</button>`)+stats()+`<div class="grid"><section class="card"><div class="cardtitle"><div><h2>Sales performance</h2><p class="muted" style="margin-top:7px">Illustrative monthly trend · ₹ in thousands</p></div><span class="badge gray">May – Oct</span></div><div class="chart"><div class="axis"><span>400</span><span>300</span><span>200</span><span>100</span></div><div class="bars">${({'Andhra Pradesh':[20,35,28,52,46,68],'Telangana':[32,47,40,64,79,90],'Karnataka':[25,30,48,40,60,75]}[currentState]).map((h,i)=>`<div class="barcol"><div class="bar" style="height:${h}%"></div><small>${['May','Jun','Jul','Aug','Sep','Oct'][i]}</small></div>`).join('')}</div></div></section><section class="card"><div class="cardtitle"><h2>Needs your attention</h2><span class="badge orange">${data.leads.filter(l=>l.stage!=='Won').length} open</span></div>${data.leads.filter(l=>l.stage!=='Won').slice(0,3).map(l=>`<div class="task"><span class="dot"></span><div><h3>${esc(l.name)}</h3><small>${esc(l.stage)} · ${esc(l.partner)}</small></div><button class="link" onclick="go('Sales Pipeline')" aria-label="View lead">↗</button></div>`).join('')}<div style="padding:12px 21px"><button class="link" onclick="go('Sales Pipeline')">View all follow-ups →</button></div></section></div><section class="card"><div class="cardtitle"><h2>Recent enquiries</h2><button class="link" onclick="go('Sales Pipeline')">View pipeline →</button></div>${leadTable()}</section>`}
function pipeline(){return title('Sales pipeline','Move every enquiry closer to a confirmed order.',`<button class="btn" onclick="leadForm()">＋ Add enquiry</button>`)+`<div class="pipeline">${stages.map(s=>`<section class="lane"><div class="row"><b>${s}</b><span>${data.leads.filter(l=>l.stage===s).length}</span></div>${data.leads.map((l,i)=>l.stage!==s?'':`<div class="card leadcard"><span class="muted">${stateCodes[currentState]}-${String(i+1).padStart(3,'0')}</span><h3 style="margin-top:9px">${esc(l.name)}</h3><p>${esc(l.need)}</p><p style="margin:8px 0">${esc(l.partner)}</p><b>${money(l.value)}</b><select aria-label="Stage for ${esc(l.name)}" onchange="data.leads[${i}].stage=this.value;save();render()">${stages.map(t=>`<option ${s===t?'selected':''}>${t}</option>`).join('')}</select></div>`).join('')}</section>`).join('')}</div>`}
function partners(){let visible=data.partners.map((p,i)=>({p,i})).filter(({p})=>partnerGroup==='All partners'||p.category===partnerGroup);return title('Your partner network','Manage partner groups separately within '+esc(currentState)+'.',`<button class="btn" onclick="partnerForm()">＋ Add partner</button>`)+`<div class="categorytabs" role="group" aria-label="Partner categories">${['All partners',...partnerCategories].map((c,i)=>`<button class="categorytab ${partnerGroup===c?'active':''}" aria-pressed="${partnerGroup===c}" onclick="selectPartnerGroup(${i-1})"><b>${esc(c)}</b><span>${data.partners.filter(p=>c==='All partners'||p.category===c).length}</span></button>`).join('')}</div><div class="categoryheading"><h2>${esc(partnerGroup)}</h2><span class="muted">${visible.length} partners · ${esc(currentState)}</span></div><div class="partnergrid">${visible.map(({p,i})=>`<section class="card partner"><span class="avatar" style="width:45px;height:45px;font-size:18px">${esc(p.name[0])}</span><h3>${esc(p.name)}</h3><p>${esc(p.category)} · ${esc(p.city)}<br>${esc(currentState)}</p><label for="category-${i}">Partner group</label><select id="category-${i}" class="partnercategory" aria-label="Category for ${esc(p.name)}" onchange="changePartnerCategory(${i},this.value)">${!partnerCategories.includes(p.category)?'<option value="" selected disabled>Choose a group</option>':''}${partnerCategories.map(c=>`<option ${c===p.category?'selected':''}>${esc(c)}</option>`).join('')}</select><hr><div class="row"><span>Sales commission</span><b>${p.rate}%</b></div><div class="row"><span>Assigned enquiries</span><b>${data.leads.filter(l=>l.partner===p.name).length}</b></div><div class="row"><span>WhatsApp API</span><span class="badge orange">Not connected</span></div><button class="btn light" style="width:100%;margin-top:16px" onclick="connection(${i})">Set up connection →</button></section>`).join('')}</div>${visible.length?'':`<div class="card empty"><h2>No partners in this group yet</h2><p style="margin:10px 0 18px">Add a ${esc(partnerGroup)} partner in ${esc(currentState)} to get started.</p><button class="btn" onclick="partnerForm()">＋ Add partner</button></div>`}`}
function inbox(){let l=data.leads[thread]||data.leads[0];return title('WhatsApp inbox','Every partner conversation, with the right sales team.')+`<section class="card inbox"><div class="threads"><div style="padding:17px"><input class="search" aria-label="Search conversations" placeholder="Search conversations…" oninput="filter=this.value;renderThreads()" id="threadsearch"></div><div id="threads"></div></div><div class="chat"><div class="cardtitle"><div><h2>${esc(l.name)}</h2><p class="muted" style="margin-top:6px">Sending as ${esc(l.partner)} · Demo number</p></div>${badge(l.stage)}</div><div class="notice">Conversation preview only. No WhatsApp account is connected; messages stay in this browser.</div><div class="messages"><div class="bubble">Hi, I’m looking for ${esc(l.need.toLowerCase())}. Could you help me with options and pricing?</div><div class="bubble mine">Hello ${esc(l.name.split(' ')[0])}! Happy to help. Could you share your preferred style and when you’re planning to purchase?</div>${(data.messages[thread]||[]).map(m=>`<div class="bubble mine">${esc(m)}</div>`).join('')}</div><form class="composer" onsubmit="event.preventDefault();sendDemo()"><input id="message" class="search" required aria-label="Message" placeholder="Write a demo reply…"><button class="btn">Save demo reply ↗</button></form></div></section>`}
function renderThreads(){let el=$('#threads');if(!el)return;el.innerHTML=data.leads.map((l,i)=>l.name.toLowerCase().includes(filter.toLowerCase())||l.partner.toLowerCase().includes(filter.toLowerCase())?`<button class="thread ${thread===i?'selected':''}" onclick="thread=${i};render()"><b>${esc(l.name)}</b><p>${esc(l.partner)}</p><p style="margin-top:7px">${esc(l.need)}</p></button>`:'').join('')||'<div class="empty">No conversations found.</div>'}function sendDemo(){let v=$('#message').value.trim();if(!v)return;(data.messages[thread]??=[]).push(v);save();render();toast('Demo reply saved locally. No message sent.');}
function commissions(){return title('Commissions','Clear agreements. Visible earnings. Simple reconciliation.',`<button class="btn light" onclick="exportCSV()">↓ Export report</button>`)+stats()+`<section class="card"><div class="cardtitle"><h2>Commission ledger</h2><span class="muted">Demo orders assume eligible payment is verified</span></div><div class="tablewrap"><table><thead><tr><th>CUSTOMER / PARTNER</th><th>ELIGIBLE SALE</th><th>RATE</th><th>COMMISSION</th><th>SETTLEMENT</th></tr></thead><tbody>${data.leads.map((l,i)=>l.stage!=='Won'?'':`<tr><td><b>${esc(l.name)}</b><br><small>${esc(l.partner)}</small></td><td>${money(l.value)}</td><td>${partner(l).rate}%</td><td>${money(l.value*partner(l).rate/100)}</td><td>${data.settled.includes(i)?'<span class="badge green">Settled</span>':`<button class="btn light" onclick="data.settled.push(${i});save();render();toast('Demo settlement recorded')">Mark settled</button>`}</td></tr>`).join('')}</tbody></table></div></section>`}
function flow(){return title('A helpful first conversation','A shared qualification flow, ready to adapt for each partner.',`<button class="btn" onclick="editFlow()">Edit welcome message</button>`)+`<section class="card"><div class="notice">Flow preview · Not deployed to WhatsApp</div><div class="flow">${[['Welcome',data.flow],['Product or service','Modular furniture · Loose furniture · Materials · Interior services'],['Project requirements','Collect location, budget, dimensions and purchase timeline.'],['Reference images','Ask the customer to share photos or drawings with the sales executive.'],['Sales team handoff','Create the enquiry, assign the partner and let your team take over.']].map((x,i)=>`<div class="flowstep"><span class="avatar">0${i+1}</span><div><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div></div>`).join('')}</div></section>`}
function stateTabs(){return `<div class="stateintro"><span class="label" style="margin:0">STATE WORKSPACES</span><span class="muted">Select a state to manage its sales operations</span></div><div class="statetabs" role="group" aria-label="State dashboards">${stateNames.map(s=>`<button class="statebutton ${s===currentState?'selected':''}" aria-pressed="${s===currentState}" onclick="switchState('${s}')"><span class="statecode">${stateCodes[s]}</span><span><b>${s}</b><small>${stateData[s].partners.length} partners · ${stateData[s].leads.length} enquiries</small></span><span class="statearrow">↗</span></button>`).join('')}</div>`}
function render(){ $('#nav').innerHTML=navs.map(n=>`<button class="nav ${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[0]}</button>`).join('');$('#crumb').textContent=currentState+' / '+page;$('#app').innerHTML=stateTabs()+({'Overview':overview,'Sales Pipeline':pipeline,'Partners':partners,'WhatsApp Inbox':inbox,'Commissions':commissions,'Chatbot Flow':flow}[page])()+`<div class="footer"><span>© Wappcart · Partner sales workspace</span><span>${esc(currentState)} · Sample data · Saved in this browser only</span></div>`;renderThreads()}
function modal(html){$('#modal').innerHTML=html;$('#modal').showModal()}const buttons='<div class="actions"><button type="button" class="btn light" onclick="document.querySelector(\'#modal\').close()">Cancel</button><button class="btn">Save</button></div>';
function leadForm(){modal(`<h2>Add an enquiry</h2><p>State: ${esc(currentState)}</p><form id="leadform"><label>Customer name</label><input name="name" required maxlength="80"><label>Requirement</label><input name="need" required maxlength="150"><label>Assign partner</label><select name="partner">${data.partners.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select><label>Estimated order value (₹)</label><input name="value" type="number" min="0" max="100000000" required><label>Lead source</label><select name="source"><option>Website enquiry</option><option>Instagram campaign</option><option>Brand referral</option><option>Vendor enquiry</option></select>${buttons}</form>`);$('#leadform').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.value=Number(f.value);f.stage='New enquiry';data.leads.push(f);save();$('#modal').close();render();toast('Enquiry added to your pipeline')}}
function partnerForm(){modal(`<h2>Add a sales partner</h2><p>State: ${esc(currentState)}</p><form id="partnerform"><label>Business name</label><input name="name" required maxlength="80"><label>Category</label><select name="category">${partnerCategories.map(c=>`<option ${c===partnerGroup?'selected':''}>${esc(c)}</option>`).join('')}</select><label>City</label><input name="city" required maxlength="60"><label>Agreed commission (%)</label><input name="rate" type="number" min="0" max="100" step="0.1" required>${buttons}</form>`);$('#partnerform').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(data.partners.some(p=>p.name.toLowerCase()===f.name.trim().toLowerCase()))return toast('A partner with this name already exists');f.name=f.name.trim();f.rate=Number(f.rate);f.state=currentState;data.partners.push(f);save();$('#modal').close();render();toast('Partner added. WhatsApp connection is pending.')}}
function connection(i){modal(`<h2>Connect ${esc(data.partners[i].name)}</h2><p>This prototype does not connect to WhatsApp yet. A live setup needs the vendor’s authorisation, Meta onboarding and a secure messaging backend.</p><div style="margin:22px 0;line-height:1.9;color:#67778d">1. Confirm ownership of the business number.<br>2. Complete the applicable Meta account onboarding.<br>3. Configure credentials and webhooks securely.<br>4. Verify sending, replies and team access.</div><p>No credentials are collected in this demo.</p><div class="actions"><button class="btn" onclick="document.querySelector('#modal').close()">Understood</button></div>`)}
function editFlow(){modal(`<h2>Edit welcome message</h2><form id="flowform"><label>Customer greeting</label><textarea name="greeting" required maxlength="500" style="width:100%;min-height:120px;padding:12px;border:1px solid #dce3ed;border-radius:6px">${esc(data.flow)}</textarea>${buttons}</form>`);$('#flowform').onsubmit=e=>{e.preventDefault();data.flow=new FormData(e.target).get('greeting');save();$('#modal').close();render();toast('Demo flow updated')}}
function exportCSV(){let rows=[['State','Customer','Partner','Value','Stage','Source','Commission rate','Commission'],...data.leads.map(l=>[currentState,l.name,l.partner,l.value,l.stage,l.source,partner(l).rate,l.stage==='Won'?l.value*partner(l).rate/100:0])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'").replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}));a.download='wappcart-'+stateSlugs[currentState]+'-sales-report.csv';a.click();URL.revokeObjectURL(a.href);toast('Sales report exported')}
</script><script src="workspace.js"></script></body></html>
